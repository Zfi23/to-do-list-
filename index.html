<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Productivity Engine</title>
    <!-- استخدام إصدار React المدمج بشكل مباشر -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            transition: 0.2s ease;
        }

        body {
            background: #FCF8F2;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        /* ===== شاشة التحميل الأولية ===== */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FCF8F2; display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 9999;
        }
        .loader {
            width: 40px; height: 40px; border: 4px solid #eee;
            border-top: 4px solid #7E57C2; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #loading-screen h2 { color: #7E57C2; margin-top: 15px; font-size: 18px; }

        /* ===== نافذة الترحيب ===== */
        .onboarding-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 27, 45, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .onboarding-box {
            background: white; padding: 40px; border-radius: 30px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .onboarding-box h2 { color: #5E35B1; margin-bottom: 10px; }
        .onboarding-box input, .onboarding-box select {
            width: 100%; padding: 12px; border-radius: 15px;
            border: 1px solid #ddd; margin: 10px 0; outline: none; font-weight: 600;
        }
        .onboarding-box button {
            width: 100%; padding: 12px; background: #7E57C2; color: white;
            border: none; border-radius: 15px; font-weight: 700; cursor: pointer;
        }

        /* ===== الإطار الرئيسي ===== */
        .app-container { max-width: 800px; width: 100%; }
        .gold-frame {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
            border-radius: 40px; padding: 30px;
            box-shadow: 0 10px 30px rgba(126, 87, 194, 0.1);
            border: 2px solid #D4AF37;
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h2 { font-size: 22px; color: #5E35B1; }
        .header .avatar { background: #7E57C2; color: white; padding: 8px 16px; border-radius: 30px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .stat-card { background: rgba(255,255,255,0.5); border-radius: 20px; padding: 15px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .stat-card .num { font-size: 24px; font-weight: 700; color: #7E57C2; }

        .task-input-area { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .task-input-area input { flex: 1; padding: 12px; border-radius: 15px; border: 1px solid #ddd; outline: none; min-width: 150px; }
        .task-input-area select { padding: 12px; border-radius: 15px; border: 1px solid #ddd; }
        .task-input-area button { background: #7E57C2; color: white; border: none; padding: 12px 20px; border-radius: 15px; cursor: pointer; }

        .task-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .task-item { background: white; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; }
        .task-item.urgent { border-left-color: #E57373; }
        .task-item.important { border-left-color: #FFB74D; }
        .task-item.normal { border-left-color: #81C784; }

        .mood-section { background: rgba(255,255,255,0.4); border-radius: 20px; padding: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .mood-grid { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .mood-btn { border: none; background: transparent; font-size: 28px; cursor: pointer; padding: 5px; border-radius: 50%; }
        .mood-btn.selected { background: #EDE7F6; }
        .mood-section textarea { width: 100%; padding: 10px; border-radius: 15px; border: 1px solid #ddd; outline: none; margin-top: 10px; font-family: 'Quicksand', sans-serif; }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .task-input-area { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="loader"></div>
        <h2>Loading Your Workspace...</h2>
    </div>

    <!-- مكان تطبيق React -->
    <div id="root"></div>

    <script type="text/babel">
        // === إخفاء شاشة التحميل بمجرد أن يبدأ التطبيق ===
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 500);

        // === 1. اللغة ===
        const lang = navigator.language.startsWith('ar') ? 'ar' : 'en';
        const t = (key) => {
            const dict = {
                en: { 
                    title: "My Productivity Zen", start: "Start", name: "Enter your name...", 
                    mood: "How are you feeling?", note: "Write your thoughts...", save: "Save Mood", 
                    add: "Add Task", urgent: "Urgent", important: "Important", normal: "Normal",
                    stats: ["Tasks", "Done", "Happy", "Moods"]
                },
                ar: { 
                    title: "رحلتي الإنتاجية", start: "ابدأ", name: "اكتب اسمك...", 
                    mood: "كيف تشعر اليوم؟", note: "اكتب أفكارك...", save: "حفظ المزاج", 
                    add: "إضافة مهمة", urgent: "عاجل", important: "مهم", normal: "عادي",
                    stats: ["مهام", "مكتملة", "سعادة", "مزاج"]
                }
            };
            return dict[lang][key] || key;
        };

        // === 2. مكون التطبيق ===
        function App() {
            const [userName, setUserName] = React.useState(localStorage.getItem('zenUser') || '');
            const [isOnboarding, setIsOnboarding] = React.useState(!localStorage.getItem('zenUser'));

            const [tasks, setTasks] = React.useState(JSON.parse(localStorage.getItem('zenTasks')) || []);
            const [moods, setMoods] = React.useState(JSON.parse(localStorage.getItem('zenMoods')) || []);
            
            const [newTask, setNewTask] = React.useState('');
            const [priority, setPriority] = React.useState('normal');
            const [currentMood, setCurrentMood] = React.useState('');
            const [moodNote, setMoodNote] = React.useState('');

            // حفظ البيانات
            React.useEffect(() => {
                localStorage.setItem('zenUser', userName);
                localStorage.setItem('zenTasks', JSON.stringify(tasks));
                localStorage.setItem('zenMoods', JSON.stringify(moods));
            }, [userName, tasks, moods]);

            // دوال المهام
            const addTask = () => {
                if(!newTask.trim()) return;
                setTasks([{ id: Date.now(), text: newTask, priority, done: false }, ...tasks]);
                setNewTask('');
            };
            const toggleDone = (id) => setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            // دوال المزاج
            const saveMood = () => {
                if(!currentMood) return;
                setMoods([{ id: Date.now(), mood: currentMood, note: moodNote, date: new Date().toLocaleDateString() }, ...moods]);
                setCurrentMood('');
                setMoodNote('');
            };

            // الإحصائيات
            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const happyMoods = moods.filter(m => m.mood === '😊' || m.mood === '🥰').length;
            const happyPct = moods.length > 0 ? Math.round((happyMoods / moods.length) * 100) : 0;

            // شاشة البداية
            if(isOnboarding) {
                return (
                    <div className="onboarding-overlay">
                        <div className="onboarding-box">
                            <h2>🌸 {t('title')}</h2>
                            <input type="text" placeholder={t('name')} value={userName} onChange={(e) => setUserName(e.target.value)} />
                            <button onClick={() => { if(userName.trim()) setIsOnboarding(false); }}>{t('start')}</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    <div className="gold-frame">
                        <div className="header">
                            <h2>🌸 {userName}'s {t('title')}</h2>
                            <div className="avatar">{lang === 'en' ? '🇬🇧 EN' : '🇸🇦 عربي'}</div>
                        </div>

                        <div className="stats-grid">
                            <div className="stat-card"><div className="num">{total}</div>{t('stats')[0]}</div>
                            <div className="stat-card"><div className="num">{done}</div>{t('stats')[1]}</div>
                            <div className="stat-card"><div className="num">{happyPct}%</div>{t('stats')[2]}</div>
                            <div className="stat-card"><div className="num">{moods.length}</div>{t('stats')[3]}</div>
                        </div>

                        <div className="task-input-area">
                            <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} placeholder="Write a task..." onKeyDown={(e) => e.key === 'Enter' && addTask()} />
                            <select value={priority} onChange={(e) => setPriority(e.target.value)}>
                                <option value="urgent">⚡ {t('urgent')}</option>
                                <option value="important">⭐ {t('important')}</option>
                                <option value="normal">📌 {t('normal')}</option>
                            </select>
                            <button onClick={addTask}>➕ {t('add')}</button>
                        </div>

                        <div className="task-list">
                            {tasks.length === 0 && <div style={{textAlign:'center', color:'#aaa'}}>No tasks yet!</div>}
                            {tasks.map(task => (
                                <div key={task.id} className={`task-item ${task.priority}`}>
                                    <span style={{textDecoration: task.done ? 'line-through' : 'none'}}>{task.text}</span>
                                    <div>
                                        <button onClick={() => toggleDone(task.id)}>✅</button>
                                        <button onClick={() => deleteTask(task.id)} style={{border:'none', background:'transparent', cursor:'pointer'}}>🗑️</button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mood-section">
                            <h3>🌿 {t('mood')}</h3>
                            <div className="mood-grid">
                                {['😊','🥰','😐','😔','😢','😡'].map(e => (
                                    <button key={e} className={`mood-btn ${currentMood === e ? 'selected' : ''}`} onClick={() => setCurrentMood(e)}>{e}</button>
                                ))}
                            </div>
                            <textarea rows="2" placeholder={t('note')} value={moodNote} onChange={(e) => setMoodNote(e.target.value)}></textarea>
                            <button onClick={saveMood} style={{marginTop:'10px', padding:'10px 20px', background:'#7E57C2', color:'white', border:'none', borderRadius:'15px', cursor:'pointer', fontWeight:'bold'}}>{t('save')}</button>
                        </div>
                    </div>
                </div>
            );
        }

        // === 3. تشغيل التطبيق ===
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
