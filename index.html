<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart React Planner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- خط لطيف -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== متغيرات الألوان ===== */
        :root {
            --bg-light: #FFF3E3;       /* صباح / نهار */
            --bg-dark: #1A153A;        /* ليل */
            --text-light: #5C4D4D;
            --text-dark: #E6DFED;
            --primary: #7B61FF;        /* بنفسجي ساحر */
            --glass-white: rgba(255, 255, 255, 0.4);
            --glass-dark: rgba(30, 20, 50, 0.6);
            --shadow-light: 0 15px 35px rgba(123, 97, 255, 0.15);
            --shadow-dark: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; transition: all 0.3s ease; }

        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
            background-color: var(--bg-light);
            color: var(--text-light);
            /* سيتم تغيير الألوان ديناميكياً عبر JS */
        }

        .glass-container {
            width: 100%; max-width: 750px;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            border-radius: 40px; padding: 30px;
            box-shadow: var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative; z-index: 10;
            transition: background 0.5s, box-shadow 0.5s, color 0.5s;
        }

        h1 { text-align: center; font-size: 28px; margin-bottom: 25px; color: var(--primary); }
        
        /* ===== البحث / الإدخال ===== */
        .input-group {
            display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .input-group input {
            flex: 1; padding: 15px 20px; border-radius: 30px;
            border: 2px solid rgba(123, 97, 255, 0.3);
            background: rgba(255,255,255,0.6);
            outline: none; font-size: 16px; color: inherit; min-width: 150px;
        }
        .input-group input:focus {
            border-color: var(--primary); box-shadow: 0 0 15px rgba(123, 97, 255, 0.3);
        }
        .input-group button {
            padding: 15px 30px; background: var(--primary); color: white;
            border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 15px rgba(123, 97, 255, 0.3); transition: 0.3s;
        }
        .input-group button:hover { transform: scale(1.05); }

        /* ===== العمودين ===== */
        .columns {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        .col-title { font-size: 14px; font-weight: 600; opacity: 0.6; margin-bottom: 10px; display: block; text-align: center; }

        /* ===== بطاقات المهام ===== */
        .task-card {
            background: rgba(255,255,255,0.7); border-radius: 16px;
            padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.02);
            border: 1px solid transparent; transition: 0.3s;
            cursor: pointer;
        }
        .task-card:hover {
            border-color: var(--primary); transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(123, 97, 255, 0.1);
        }
        .task-card .text { font-size: 15px; font-weight: 600; }
        .task-card .delete-btn {
            background: transparent; border: none; font-size: 18px;
            color: #ff6b6b; cursor: pointer; transition: 0.3s;
        }
        .task-card .delete-btn:hover { transform: rotate(90deg) scale(1.2); }

        /* علامة التوهج (Neon Glow) عند الإضافة */
        .task-card.just-added {
            animation: neonPulse 0.8s ease-out;
        }
        @keyframes neonPulse {
            0% { box-shadow: 0 0 30px rgba(123, 97, 255, 0.6); transform: scale(0.98); }
            100% { box-shadow: 0 5px 10px rgba(0,0,0,0.02); transform: scale(1); }
        }

        .empty-msg { text-align: center; color: #aaa; padding: 20px; font-size: 14px; }

        /* ===== الثيم الليلي ===== */
        body.night-theme {
            background-color: var(--bg-dark); color: var(--text-dark);
        }
        body.night-theme .glass-container {
            background: var(--glass-dark); box-shadow: var(--shadow-dark);
        }
        body.night-theme .input-group input {
            background: rgba(255,255,255,0.1); color: white;
        }
        body.night-theme .task-card {
            background: rgba(255,255,255,0.05); color: white;
        }
        body.night-theme .task-card:hover {
            border-color: var(--primary); box-shadow: 0 10px 25px rgba(123, 97, 255, 0.3);
        }

        /* ===== التجاوب للهواتف ===== */
        @media (max-width: 600px) {
            .columns { grid-template-columns: 1fr; gap: 10px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const translations = {
            en: {
                title: "✨ Smart Planner",
                placeholder: "Write a new task...",
                add: "Add",
                pending: "To Do",
                done: "Done",
                empty: "🎉 No tasks yet! Add one above."
            },
            ar: {
                title: "✨ مخطط ذكي",
                placeholder: "اكتب مهمة جديدة...",
                add: "إضافة",
                pending: "مهامي",
                done: "مكتملة",
                empty: "🎉 لا توجد مهام! أضف واحدة فوق."
            }
        };

        // 1. تحديد لغة الجهاز
        const userLang = navigator.language.startsWith('ar') ? 'ar' : 'en';
        const t = (key) => translations[userLang][key];

        // 2. تحديد وقت الجهاز للثيم
        const hour = new Date().getHours();
        if (hour < 6 || hour >= 18) document.body.classList.add('night-theme');

        // 3. استرجاع المهام من التخزين (LocalStorage)
        const savedTasks = JSON.parse(localStorage.getItem('reactTasks')) || [
            { id: 1, text: "تعلم React", completed: false },
            { id: 2, text: "بناء تطبيق To-Do", completed: true }
        ];

        function App() {
            const [tasks, setTasks] = React.useState(savedTasks);
            const [inputText, setInputText] = React.useState('');
            const [animId, setAnimId] = React.useState(null);

            // حفظ المهام عند أي تغيير
            React.useEffect(() => {
                localStorage.setItem('reactTasks', JSON.stringify(tasks));
            }, [tasks]);

            const addTask = () => {
                if (inputText.trim() === '') return;
                const newTask = { id: Date.now(), text: inputText, completed: false };
                setTasks([...tasks, newTask]);
                setAnimId(newTask.id);
                setInputText('');
                setTimeout(() => setAnimId(null), 800);
            };

            const toggleComplete = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            // تقسيم المهام إلى عمودين
            const pendingTasks = tasks.filter(t => !t.completed);
            const doneTasks = tasks.filter(t => t.completed);

            return (
                <div className="glass-container">
                    <h1>{t('title')}</h1>
                    
                    <div className="input-group">
                        <input 
                            type="text" 
                            value={inputText} 
                            onChange={(e) => setInputText(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && addTask()}
                            placeholder={t('placeholder')}
                        />
                        <button onClick={addTask}>{t('add')}</button>
                    </div>

                    <div className="columns">
                        {/* عمود المهام غير المكتملة */}
                        <div>
                            <span className="col-title">{t('pending')}</span>
                            {pendingTasks.length === 0 ? (
                                <div className="empty-msg">{t('empty')}</div>
                            ) : (
                                pendingTasks.map(task => (
                                    <div 
                                        key={task.id} 
                                        className={`task-card ${animId === task.id ? 'just-added' : ''}`}
                                        onClick={() => toggleComplete(task.id)}
                                    >
                                        <span className="text">⬜ {task.text}</span>
                                        <button className="delete-btn" onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }}>✕</button>
                                    </div>
                                ))
                            )}
                        </div>

                        {/* عمود المهام المكتملة */}
                        <div>
                            <span className="col-title">{t('done')}</span>
                            {doneTasks.length === 0 ? (
                                <div className="empty-msg" style={{opacity:0.5}}>--</div>
                            ) : (
                                doneTasks.map(task => (
                                    <div 
                                        key={task.id} 
                                        className="task-card"
                                        onClick={() => toggleComplete(task.id)}
                                    >
                                        <span className="text">✅ {task.text}</span>
                                        <button className="delete-btn" onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }}>✕</button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
