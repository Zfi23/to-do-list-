<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planner React</title>
    <!-- استيراد React و Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* === تنسيق المشروع القديم (مع تحسينات React) === */
        :root {
            --bg-color: #FFF3E3;
            --container-bg: rgba(255, 248, 240, 0.8);
            --text-main: #5C4D4D;
            --text-muted: #A28F8F;
            --pink: #F7A1C4;
            --green: #9ED9CC;
            --card-bg: rgba(255, 255, 255, 0.6);
            --shadow: 0 10px 30px rgba(247, 161, 196, 0.15);
            --input-bg: rgba(255, 255, 255, 0.8);
        }

        body.night-theme {
            --bg-color: #2D2438;
            --container-bg: rgba(45, 36, 56, 0.8);
            --text-main: #E6DFED;
            --text-muted: #A99BB5;
            --pink: #C49AC8;
            --green: #80A89C;
            --card-bg: rgba(58, 44, 75, 0.6);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --input-bg: rgba(74, 59, 91, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; transition: all 0.3s ease; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
        }

        .app-container {
            max-width: 900px; width: 100%;
            background: var(--container-bg); backdrop-filter: blur(20px);
            border-radius: 50px; padding: 30px;
            box-shadow: var(--shadow); border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 26px; font-weight: 700; }
        .name-input { padding: 8px 15px; border-radius: 30px; border: 1px solid var(--pink); background: var(--input-bg); color: var(--text-main); outline: none; width: 160px; font-weight: 600; }

        .stats-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: var(--card-bg); padding: 15px 20px; border-radius: 20px; flex: 1; text-align: center; border: 1px solid rgba(255,255,255,0.2); box-shadow: var(--shadow); }
        .stat-card span { font-size: 22px; font-weight: 700; display: block; color: var(--pink); }

        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .task-card { background: var(--card-bg); border-radius: 30px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.1); }
        .task-card.done { border-color: var(--green); }
        .task-card .text { font-weight: 600; }
        .btn-del { background: #FFCDD2; border: none; color: #C62828; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .btn-done { background: var(--green); border: none; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .input-area { display: flex; gap: 10px; background: var(--card-bg); padding: 15px; border-radius: 50px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.1); }
        .input-area input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-weight: 600; padding: 10px; }
        .input-area button { background: var(--pink); border: none; color: white; padding: 10px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; }

        .confetti-piece { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 9999; pointer-events: none; }
        .confetti-piece.circle { border-radius: 50%; }
        .confetti-piece.square { border-radius: 2px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // === كود React الرئيسي ===
        function App() {
            // 1. إدارة الحالات (State)
            const [tasks, setTasks] = React.useState(() => {
                const saved = localStorage.getItem('plannerTasks');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: 'تعلم React', done: true },
                    { id: 2, text: 'إنجاز المشروع', done: false }
                ];
            });
            const [name, setName] = React.useState(localStorage.getItem('userName') || 'Bunny');
            const [inputText, setInputText] = React.useState('');
            const [timer, setTimer] = React.useState(300); // 5 دقائق
            const [isRunning, setIsRunning] = React.useState(false);

            // 2. الحفظ التلقائي في LocalStorage
            React.useEffect(() => {
                localStorage.setItem('userName', name);
                localStorage.setItem('plannerTasks', JSON.stringify(tasks));
            }, [name, tasks]);

            // 3. الثيم الليلي التلقائي
            React.useEffect(() => {
                const hour = new Date().getHours();
                if (hour < 6 || hour >= 18) {
                    document.body.classList.add('night-theme');
                } else {
                    document.body.classList.remove('night-theme');
                }
            }, []);

            // 4. المؤقت
            React.useEffect(() => {
                let interval = null;
                if (isRunning && timer > 0) {
                    interval = setInterval(() => setTimer(t => t - 1), 1000);
                } else if (timer === 0) {
                    setIsRunning(false);
                    alert("⏰ انتهى الوقت! عمل رائع!");
                }
                return () => clearInterval(interval);
            }, [isRunning, timer]);

            // 5. دالة الاحتفال (Confetti)
            const launchConfetti = () => {
                const colors = ['#F7A1C4', '#FCE4EC', '#FFD54F', '#80CBC4', '#B39DDB'];
                for (let i = 0; i < 50; i++) {
                    const piece = document.createElement('div');
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const left = Math.random() * 100;
                    const size = Math.random() * 8 + 6;
                    const shape = Math.random() > 0.5 ? 'circle' : 'square';
                    piece.className = `confetti-piece ${shape}`;
                    piece.style.left = `${left}vw`;
                    piece.style.backgroundColor = color;
                    piece.style.width = `${size}px`;
                    piece.style.height = `${size}px`;
                    document.body.appendChild(piece);
                    
                    let startTime = null;
                    const startY = -10;
                    const endY = window.innerHeight + 10;
                    const wobbleX = (Math.random() - 0.5) * 300;
                    const duration = Math.random() * 2 + 2;
                    const rotation = Math.random() * 720;

                    function animatePiece(time) {
                        if (startTime === null) startTime = time;
                        const progress = (time - startTime) / (duration * 1000);
                        if (progress >= 1) { piece.remove(); return; }
                        const y = startY + (endY - startY) * progress;
                        const x = wobbleX * Math.sin(progress * 10);
                        piece.style.transform = `translate(${x}px, ${y}px) rotate(${rotation * progress}deg)`;
                        piece.style.opacity = 1 - (progress * 0.8);
                        requestAnimationFrame(animatePiece);
                    }
                    setTimeout(() => requestAnimationFrame(animatePiece), Math.random() * 500);
                }
            };

            const addTask = () => {
                if (inputText.trim() === '') return;
                setTasks([...tasks, { id: Date.now(), text: inputText, done: false }]);
                setInputText('');
            };

            const toggleDone = (id) => {
                const task = tasks.find(t => t.id === id);
                if (task && !task.done) launchConfetti(); // احتفال عند إكمال المهمة
                setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            // إحصائيات
            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const completionRate = total === 0 ? 0 : Math.round((done / total) * 100);

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🌸 Good Morning, <input className="name-input" value={name} onChange={(e) => setName(e.target.value)} /></h1>
                        <div style={{ fontSize: '14px', fontWeight: 'bold', color: 'var(--pink)' }}>
                            {new Date().toLocaleTimeString()}
                        </div>
                    </div>

                    <div className="stats-row">
                        <div className="stat-card"><span>{completionRate}%</span>Completed</div>
                        <div className="stat-card"><span>{total}</span>Total Tasks</div>
                        <div className="stat-card"><span>{done}</span>Done</div>
                    </div>

                    <div style={{ display: 'flex', gap: '10px', marginBottom: '20px', alignItems: 'center' }}>
                        <div style={{ background: 'var(--card-bg)', padding: '10px 20px', borderRadius: '30px', fontWeight: 'bold', color: 'var(--pink)' }}>
                            {Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}
                        </div>
                        <button onClick={() => setIsRunning(!isRunning)} style={{ padding: '10px 20px', borderRadius: '30px', border: 'none', background: isRunning ? '#ff6b6b' : 'var(--green)', color: 'white', fontWeight: 'bold', cursor: 'pointer' }}>
                            {isRunning ? 'Stop' : 'Start Timer'}
                        </button>
                    </div>

                    <div className="task-grid">
                        {tasks.map(task => (
                            <div key={task.id} className={`task-card ${task.done ? 'done' : ''}`}>
                                <span className="text">{task.text}</span>
                                <div>
                                    <button className="btn-done" onClick={() => toggleDone(task.id)}>
                                        {task.done ? '✅' : 'Mark Done'}
                                    </button>
                                    <button className="btn-del" onClick={() => deleteTask(task.id)}>✕</button>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="input-area">
                        <input value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addTask()} placeholder="Write something cute..." />
                        <button onClick={addTask}>➕ Add</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
