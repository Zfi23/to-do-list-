<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Productivity Engine</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #FCF8F2;
            --purple-main: #7E57C2;
            --purple-dark: #5E35B1;
            --purple-light: #EDE7F6;
            --card-bg: rgba(255, 255, 255, 0.8);
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
            --text-main: #2D1B2D;
            --text-muted: #887A8E;
            --shadow: 0 8px 20px rgba(126, 87, 194, 0.1);
            --gold: #D4AF37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; transition: 0.3s ease; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
        }

        .app-container { max-width: 950px; width: 100%; }

        .onboarding-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 27, 45, 0.6); backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .onboarding-box {
            background: white; padding: 40px; border-radius: 30px; max-width: 400px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); text-align: center;
        }
        .onboarding-box h2 { color: var(--purple-dark); }
        .onboarding-box input, .onboarding-box select {
            width: 100%; padding: 12px; border-radius: 15px; border: 1px solid #ddd;
            margin: 15px 0; font-weight: 600; outline: none;
        }
        .onboarding-box input:focus { border-color: var(--purple-main); }
        .onboarding-box button {
            width: 100%; padding: 12px; background: var(--purple-main); color: white;
            border: none; border-radius: 15px; font-weight: 700; cursor: pointer;
        }

        .gold-frame {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 40px; padding: 30px;
            box-shadow: var(--shadow), 0 0 0 2px var(--gold), 0 0 0 4px var(--bg-main);
            border: 2px solid var(--gold);
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .header h2 { color: var(--purple-dark); font-size: 22px; }
        .header .avatar { background: var(--purple-main); color: white; padding: 8px 16px; border-radius: 30px; font-weight: 600; font-size: 14px; }

        /* --- بطاقة الإحصائيات --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.5); border-radius: 20px; padding: 15px; text-align: center; border: var(--glass-border); }
        .stat-card .num { font-size: 28px; font-weight: 700; color: var(--purple-main); }
        .stat-card .lbl { font-size: 12px; color: var(--text-muted); }

        /* --- قسم المهام --- */
        .task-input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        .task-input-area input { flex: 1; padding: 12px; border-radius: 15px; border: 1px solid #ddd; outline: none; font-weight: 600; }
        .task-input-area select { padding: 12px; border-radius: 15px; border: 1px solid #ddd; outline: none; font-weight: 600; }
        .task-input-area button { padding: 12px 20px; background: var(--purple-main); color: white; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; }

        .task-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .task-item { background: white; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; }
        .task-item.urgent { border-left-color: #E57373; }
        .task-item.important { border-left-color: #FFB74D; }
        .task-item.normal { border-left-color: #81C784; }
        .task-item .text { font-weight: 600; }
        .task-item .actions button { background: #f0f0f0; border: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; margin-left: 5px; font-weight: 600; }
        .task-item .actions .done-btn { background: var(--purple-light); color: var(--purple-dark); }

        /* --- قسم المزاج --- */
        .mood-section { background: rgba(255,255,255,0.4); border-radius: 20px; padding: 20px; margin-top: 20px; border: var(--glass-border); }
        .mood-grid { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .mood-btn { border: none; background: transparent; font-size: 28px; cursor: pointer; transition: 0.2s; padding: 5px; border-radius: 50%; }
        .mood-btn:hover { transform: scale(1.2); background: rgba(0,0,0,0.05); }
        .mood-btn.selected { background: var(--purple-light); box-shadow: 0 0 0 2px var(--purple-main); }
        .mood-section textarea { width: 100%; padding: 10px; border-radius: 15px; border: 1px solid #ddd; outline: none; margin-top: 10px; font-weight: 600; resize: vertical; }

        @media (max-width: 600px) {
            .task-input-area { flex-direction: column; }
            .task-input-area select { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. إعدادات اللغة ---
        const getDefaultLang = () => navigator.language.startsWith('ar') ? 'ar' : 'en';
        const t = (key) => {
            const dict = {
                en: { title: "My Productivity Zen", start: "Start Your Journey", name: "Enter your name...", mood: "How are you feeling today?", note: "Write your thoughts...", save: "Save Mood", add: "Add Task", urgent: "Urgent", important: "Important", normal: "Normal", stats: ["Total Tasks", "Completed", "Mood Entries"] },
                ar: { title: "رحلتي الإنتاجية", start: "ابدأ رحلتك", name: "اكتب اسمك...", mood: "كيف تشعر اليوم؟", note: "اكتب أفكارك...", save: "حفظ المزاج", add: "إضافة مهمة", urgent: "عاجل", important: "مهم", normal: "عادي", stats: ["إجمالي المهام", "المكتملة", "تسجيلات المزاج"] }
            };
            return dict[lang][key] || key;
        };

        // --- 2. حالة التطبيق الرئيسية ---
        function App() {
            const [lang, setLang] = React.useState(localStorage.getItem('zenLang') || getDefaultLang());
            const [userName, setUserName] = React.useState(localStorage.getItem('zenUser') || '');
            const [isOnboarding, setIsOnboarding] = React.useState(!localStorage.getItem('zenUser'));
            
            const [tasks, setTasks] = React.useState(() => JSON.parse(localStorage.getItem('zenTasks')) || []);
            const [moodLogs, setMoodLogs] = React.useState(() => JSON.parse(localStorage.getItem('zenMoods')) || []);
            
            const [newTask, setNewTask] = React.useState('');
            const [priority, setPriority] = React.useState('normal');
            const [currentMood, setCurrentMood] = React.useState('');
            const [moodNote, setMoodNote] = React.useState('');

            // حفظ البيانات
            React.useEffect(() => {
                localStorage.setItem('zenUser', userName);
                localStorage.setItem('zenLang', lang);
                localStorage.setItem('zenTasks', JSON.stringify(tasks));
                localStorage.setItem('zenMoods', JSON.stringify(moodLogs));
            }, [userName, lang, tasks, moodLogs]);

            // --- دوال المهام ---
            const addTask = () => {
                if(!newTask.trim()) return;
                setTasks([{ id: Date.now(), text: newTask, priority, done: false }, ...tasks]);
                setNewTask('');
            };

            const toggleDone = (id) => setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            // --- دوال المزاج ---
            const saveMood = () => {
                if(!currentMood) return;
                setMoodLogs([{ id: Date.now(), mood: currentMood, note: moodNote, date: new Date().toLocaleDateString() }, ...moodLogs]);
                setCurrentMood('');
                setMoodNote('');
            };

            // --- إحصائيات ذكية ---
            const totalTasks = tasks.length;
            const doneTasks = tasks.filter(t => t.done).length;
            const moodCount = moodLogs.length;
            const happyMoods = moodLogs.filter(m => m.mood === '😊' || m.mood === '🥰').length;
            const happinessPercentage = moodCount > 0 ? Math.round((happyMoods / moodCount) * 100) : 0;

            // --- شاشة البداية ---
            if(isOnboarding) {
                return (
                    <div className="onboarding-overlay">
                        <div className="onboarding-box">
                            <h2>🌸 {t('title')}</h2>
                            <input type="text" placeholder={t('name')} value={userName} onChange={(e) => setUserName(e.target.value)} />
                            <select value={lang} onChange={(e) => setLang(e.target.value)}>
                                <option value="en">🇬🇧 English</option>
                                <option value="ar">🇸🇦 العربية</option>
                            </select>
                            <button onClick={() => { if(userName.trim()) setIsOnboarding(false); }}>{t('start')}</button>
                        </div>
                    </div>
                );
            }

            // --- الواجهة الرئيسية ---
            return (
                <div className="app-container">
                    <div className="gold-frame">
                        <div className="header">
                            <h2>🌸 {userName}'s {t('title')}</h2>
                            <div className="avatar">{lang === 'en' ? 'EN' : 'عربي'}</div>
                        </div>

                        {/* الإحصائيات */}
                        <div className="stats-grid">
                            <div className="stat-card"><div className="num">{totalTasks}</div><div className="lbl">{t('stats')[0]}</div></div>
                            <div className="stat-card"><div className="num">{doneTasks}</div><div className="lbl">{t('stats')[1]}</div></div>
                            <div className="stat-card"><div className="num">{happinessPercentage}%</div><div className="lbl">😊 Happiness</div></div>
                            <div className="stat-card"><div className="num">{moodCount}</div><div className="lbl">{t('stats')[2]}</div></div>
                        </div>

                        {/* إضافة مهمة */}
                        <div className="task-input-area">
                            <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} placeholder="Add a new task..." onKeyDown={(e) => e.key === 'Enter' && addTask()} />
                            <select value={priority} onChange={(e) => setPriority(e.target.value)}>
                                <option value="urgent">{t('urgent')}</option>
                                <option value="important">{t('important')}</option>
                                <option value="normal">{t('normal')}</option>
                            </select>
                            <button onClick={addTask}>{t('add')}</button>
                        </div>

                        {/* قائمة المهام */}
                        <div className="task-list">
                            {tasks.length === 0 && <div style={{textAlign:'center', color:'var(--text-muted)', padding:'20px'}}>No tasks yet. Start your day!</div>}
                            {tasks.map(task => (
                                <div key={task.id} className={`task-item ${task.priority}`}>
                                    <span className="text" style={{ textDecoration: task.done ? 'line-through' : 'none', opacity: task.done ? 0.6 : 1 }}>
                                        {task.text}
                                    </span>
                                    <div className="actions">
                                        <button className="done-btn" onClick={() => toggleDone(task.id)}>{task.done ? '↩️' : '✅'}</button>
                                        <button onClick={() => deleteTask(task.id)}>🗑️</button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* تتبع المزاج */}
                        <div className="mood-section">
                            <h3 style={{color:'var(--purple-dark)'}}>🌿 {t('mood')}</h3>
                            <div className="mood-grid">
                                {['😊', '🥰', '😐', '😔', '😢', '😡'].map(emoji => (
                                    <button key={emoji} className={`mood-btn ${currentMood === emoji ? 'selected' : ''}`} onClick={() => setCurrentMood(emoji)}>
                                        {emoji}
                                    </button>
                                ))}
                            </div>
                            <textarea rows="2" placeholder={t('note')} value={moodNote} onChange={(e) => setMoodNote(e.target.value)}></textarea>
                            <button onClick={saveMood} style={{marginTop:'10px', padding:'10px 20px', background:'var(--purple-main)', color:'white', border:'none', borderRadius:'15px', fontWeight:'700', cursor:'pointer'}}>{t('save')}</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
