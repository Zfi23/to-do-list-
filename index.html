<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planner React</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF3E3;
            --text-main: #5C4D4D;
            --text-muted: #A28F8F;
            --pink: #F7A1C4;
            --green: #9ED9CC;
            --card-bg: rgba(255, 255, 255, 0.6);
            --shadow: 0 10px 30px rgba(247, 161, 196, 0.15);
            --radius: 30px;
        }

        body.night-theme {
            --bg-color: #2D2438;
            --text-main: #E6DFED;
            --text-muted: #A99BB5;
            --pink: #C49AC8;
            --green: #80A89C;
            --card-bg: rgba(58, 44, 75, 0.6);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        body.relax-mode {
            --bg-color: #E8E0D5;
            --text-main: #8A7D7D;
            --text-muted: #BDB0B0;
            --pink: #D4B6B6;
            --green: #BCC9C9;
            --card-bg: rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; transition: all 0.3s ease; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
        }

        .app-container {
            max-width: 900px; width: 100%;
            background: var(--card-bg); backdrop-filter: blur(20px);
            border-radius: 50px; padding: 30px;
            box-shadow: var(--shadow); border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 26px; font-weight: 700; }
        .name-input { padding: 8px 15px; border-radius: 30px; border: 2px solid var(--pink); background: rgba(255,255,255,0.3); color: var(--text-main); outline: none; width: 160px; font-weight: 600; }

        .stats-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.2); padding: 15px 20px; border-radius: 20px; flex: 1; text-align: center; }
        .stat-card span { font-size: 22px; font-weight: 700; display: block; color: var(--pink); }

        .timer-section {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            margin-bottom: 20px; background: rgba(255,255,255,0.1);
            padding: 20px; border-radius: 30px; flex-wrap: wrap;
        }
        .timer-ring {
            position: relative; width: 100px; height: 100px;
        }
        .timer-ring svg { transform: rotate(-90deg); width: 100px; height: 100px; }
        .timer-ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .timer-bg { stroke: rgba(255,255,255,0.2); }
        .timer-progress { stroke: var(--pink); transition: stroke-dashoffset 0.5s ease; }
        .timer-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: 700; color: var(--pink);
        }

        .timer-controls { display: flex; align-items: center; gap: 10px; }
        .timer-input {
            width: 50px; padding: 8px; border-radius: 20px; border: 2px solid var(--pink);
            background: rgba(255,255,255,0.3); color: var(--text-main); text-align: center; font-weight: 700; outline: none;
        }

        .timer-btn {
            padding: 12px 30px; border-radius: 30px; border: none;
            background: var(--green); color: white; font-weight: 700; cursor: pointer;
        }
        .timer-btn.stop { background: #ff6b6b; }

        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .task-card { background: rgba(255,255,255,0.4); border-radius: 30px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .task-card.done { border: 2px solid var(--green); }
        .task-card .text { font-weight: 600; }
        .btn-del { background: #FFCDD2; border: none; color: #C62828; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .btn-done { background: var(--green); border: none; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .input-area { display: flex; gap: 10px; background: rgba(255,255,255,0.2); padding: 15px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); }
        .input-area input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-weight: 600; padding: 10px; }
        .input-area button { background: var(--pink); border: none; color: white; padding: 10px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; }

        @media (max-width: 500px) { .timer-section { flex-direction: column; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const userLang = navigator.language.startsWith('ar') ? 'ar' : 'en';
        const t = (key) => {
            const dict = {
                en: { title: "🌸 My Planner", task: "Task", done: "Done", add: "Add", start: "Start", stop: "Stop", placeholder: "Enter your name", timer: "min" },
                ar: { title: "🌸 مخططي", task: "مهمة", done: "تم", add: "إضافة", start: "ابدأ", stop: "إيقاف", placeholder: "اكتب اسمك", timer: "دقيقة" }
            };
            return dict[userLang][key];
        };

        const hour = new Date().getHours();
        if (hour < 6 || hour >= 18) document.body.classList.add('night-theme');

        function App() {
            const [tasks, setTasks] = React.useState(() => {
                const saved = localStorage.getItem('plannerTasks');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: `${t('task')} 1`, done: true },
                    { id: 2, text: `${t('task')} 2`, done: false }
                ];
            });
            const [name, setName] = React.useState(localStorage.getItem('userName') || '');
            const [inputText, setInputText] = React.useState('');
            
            const [timer, setTimer] = React.useState(300);
            const [isRunning, setIsRunning] = React.useState(false);
            const [relaxMode, setRelaxMode] = React.useState(false);
            const [userMinutes, setUserMinutes] = React.useState(5);

            React.useEffect(() => {
                localStorage.setItem('userName', name);
                localStorage.setItem('plannerTasks', JSON.stringify(tasks));
            }, [name, tasks]);

            React.useEffect(() => {
                let interval = null;
                if (isRunning && timer > 0) {
                    interval = setInterval(() => setTimer(prev => prev - 1), 1000);
                } else if (timer === 0 && isRunning) {
                    setIsRunning(false);
                    setRelaxMode(true);
                    document.body.classList.add('relax-mode');
                    setTimeout(() => {
                        setRelaxMode(false);
                        document.body.classList.remove('relax-mode');
                        setTimer(userMinutes * 60);
                    }, 10000);
                }
                return () => clearInterval(interval);
            }, [isRunning, timer]);

            const circumference = 2 * Math.PI * 40;
            const progress = ((userMinutes * 60 - timer) / (userMinutes * 60)) * circumference;

            const addTask = () => {
                if (inputText.trim() === '') return;
                setTasks([...tasks, { id: Date.now(), text: inputText, done: false }]);
                setInputText('');
            };

            const toggleDone = (id) => {
                const task = tasks.find(t => t.id === id);
                if (task && !task.done) launchConfetti();
                setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
            };

            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const rate = total === 0 ? 0 : Math.round((done / total) * 100);

            const handleTimerChange = (e) => {
                const val = parseInt(e.target.value);
                if (!isNaN(val) && val > 0) {
                    setUserMinutes(val);
                    setTimer(val * 60);
                }
            };

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>{t('title')}, 
                            <input 
                                className="name-input" 
                                value={name} 
                                onChange={(e) => setName(e.target.value)} 
                                placeholder={t('placeholder')}
                            />
                        </h1>
                        <div style={{ fontSize: '14px', fontWeight: 'bold', color: 'var(--pink)' }}>
                            {new Date().toLocaleTimeString()}
                        </div>
                    </div>

                    <div className="stats-row">
                        <div className="stat-card"><span>{rate}%</span>Done</div>
                        <div className="stat-card"><span>{total}</span>Total</div>
                        <div className="stat-card"><span>{done}</span>Completed</div>
                    </div>

                    <div className="timer-section">
                        <div className="timer-ring">
                            <svg viewBox="0 0 100 100">
                                <circle className="timer-bg" cx="50" cy="50" r="40"></circle>
                                <circle className="timer-progress" cx="50" cy="50" r="40" 
                                    strokeDasharray={circumference} 
                                    strokeDashoffset={circumference - progress}
                                    style={{ stroke: isRunning ? '#6C63FF' : '#E8D5F5' }}>
                                </circle>
                            </svg>
                            <div className="timer-text">
                                {String(Math.floor(timer/60)).padStart(2,'0')}:{String(timer%60).padStart(2,'0')}
                            </div>
                        </div>
                        <div className="timer-controls">
                            <input type="number" className="timer-input" value={userMinutes} onChange={handleTimerChange} min="1" />
                            <span style={{ fontSize: '14px', color: 'var(--text-muted)' }}>{t('timer')}</span>
                            <button className={`timer-btn ${isRunning ? 'stop' : ''}`} onClick={() => setIsRunning(!isRunning)}>
                                {isRunning ? t('stop') : t('start')}
                            </button>
                        </div>
                    </div>

                    <div className="task-grid">
                        {tasks.map(task => (
                            <div key={task.id} className={`task-card ${task.done ? 'done' : ''}`}>
                                <span className="text">{task.text}</span>
                                <div>
                                    <button className="btn-done" onClick={() => toggleDone(task.id)}>
                                        {task.done ? '✅' : t('done')}
                                    </button>
                                    <button className="btn-del" onClick={() => deleteTask(task.id)}>✕</button>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="input-area">
                        <input value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addTask()} placeholder="Write something cute..." />
                        <button onClick={addTask}>➕ {t('add')}</button>
                    </div>
                </div>
            );
        }

        function launchConfetti() {
            const colors = ['#F7A1C4', '#FCE4EC', '#FFD54F', '#80CBC4', '#B39DDB', '#FFAB91'];
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                piece.className = `confetti-piece ${Math.random() > 0.5 ? 'circle' : 'square'}`;
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = `${Math.random() * 8 + 6}px`;
                piece.style.height = piece.style.width;
                document.body.appendChild(piece);
                
                let start = null;
                const duration = Math.random() * 2 + 2;
                const wobble = (Math.random() - 0.5) * 300;
                const rotation = Math.random() * 720;

                function anim(time) {
                    if (!start) start = time;
                    const prog = (time - start) / (duration * 1000);
                    if (prog >= 1) { piece.remove(); return; }
                    const y = -10 + (window.innerHeight + 20) * prog;
                    const x = wobble * Math.sin(prog * 10);
                    piece.style.transform = `translate(${x}px, ${y}px) rotate(${rotation * prog}deg)`;
                    piece.style.opacity = 1 - prog * 0.8;
                    requestAnimationFrame(anim);
                }
                setTimeout(() => requestAnimationFrame(anim), Math.random() * 500);
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
