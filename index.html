<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Zen Journal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
            transition: background 2s ease; overflow: hidden;
        }

        /* === الخلفية الحية (الأرض والسماء مفصولة) === */
        .world-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; transition: background 3s ease;
        }
        /* النهار */
        .world-background.day {
            background: linear-gradient(180deg, #87CEEB 0%, #b4e4f7 40%, #7cb342 40.5%, #558b2f 100%);
        }
        /* الليل */
        .world-background.night {
            background: linear-gradient(180deg, #0b1426 0%, #1A2A44 40%, #1b3a24 40.5%, #0a1a2a 100%);
        }

        /* === الكائنات الحية === */
        .sun { position: absolute; top: 5%; right: 5%; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(#FFD700, #FF8C00); box-shadow: 0 0 100px #FFD700; transition: 2s; }
        .night .sun { opacity: 0; transform: scale(0.5); }
        
        .moon { position: absolute; top: 5%; right: 5%; width: 60px; height: 60px; border-radius: 50%; background: #F5F5DC; box-shadow: 0 0 50px rgba(255, 255, 224, 0.3); opacity: 0; transition: 2s; }
        .night .moon { opacity: 1; }

        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 40%; opacity: 0; transition: 2s; pointer-events: none; background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 40px 70px, #eee, transparent); background-size: 200px 100px; }
        .night .stars { opacity: 1; }

        /* غيوم على شكل ☁️ */
        .cloud-icon { position: absolute; font-size: 50px; color: rgba(255,255,255,0.9); animation: floatCloud linear infinite; }
        .day .cloud-icon { opacity: 1; } .night .cloud-icon { opacity: 0.2; }
        @keyframes floatCloud { 0% { transform: translateX(-10vw); } 100% { transform: translateX(110vw); } }

        /* الأشجار (أضفنا شجرة جميلة) */
        .tree-container { position: absolute; bottom: 18%; left: 5%; font-size: 80px; opacity: 0.9; transition: 2s; }
        .night .tree-container { opacity: 0.5; }

        /* الورود المبتسمة */
        .flowers { position: absolute; bottom: 20%; left: 2%; font-size: 30px; animation: sway 4s ease-in-out infinite; }
        .night .flowers { opacity: 0.4; animation: none; transform: scale(0.9); }
        @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

        /* القطة */
        .cat { position: absolute; bottom: 22%; right: 5%; font-size: 55px; transition: 2s; }
        .day .cat { animation: jump 2s ease-in-out infinite; }
        .night .cat { animation: sleep 2s ease-in-out infinite; transform-origin: bottom; }
        @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes sleep { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg) scale(0.95); } }

        /* === الواجهة الزجاجية الذهبية === */
        .glass-container {
            position: relative; z-index: 1; max-width: 850px; width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 3px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.02);
            border-radius: 40px; padding: 30px;
            color: #2D1B2D;
        }
        .night .glass-container {
            background: rgba(10, 8, 20, 0.2);
            color: #E6DFED;
            border-color: rgba(212, 175, 55, 0.3);
        }

        /* === الترحيب === */
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .header h2 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .name-input { padding: 8px 15px; border-radius: 30px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.1); color: inherit; outline: none; font-weight: 600; width: 150px; }

        /* الوقت والتاريخ منفصلين */
        .time-date { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; font-weight: 600; opacity: 0.8; line-height: 1.4; }

        /* === الإحصائيات === */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; text-align: center; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.05); }
        .stat-card .num { font-size: 24px; font-weight: 700; }

        /* === العداد الدائري === */
        .timer-ring-container { display: flex; justify-content: center; align-items: center; flex-direction: column; margin-bottom: 25px; }
        .timer-ring-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 10px; }
        .timer-ring-wrapper svg { transform: rotate(-90deg); width: 180px; height: 180px; }
        .timer-ring-wrapper circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .timer-bg { stroke: rgba(255,255,255,0.15); }
        .timer-progress { stroke: #F7A1C4; transition: stroke-dashoffset 0.5s ease; }
        .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 700; }
        
        .timer-controls { display: flex; align-items: center; gap: 10px; }
        .timer-input { width: 50px; padding: 8px; border-radius: 20px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.1); color: inherit; text-align: center; font-weight: 700; outline: none; }
        .timer-btn { padding: 8px 20px; border-radius: 30px; border: none; background: #F7A1C4; color: white; font-weight: 700; cursor: pointer; }
        .timer-btn.stop { background: #ff6b6b; }

        /* === المهام === */
        .task-grid { display: flex; flex-direction: column; gap: 10px; }
        .task-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05); }
        .task-card.done { opacity: 0.7; text-decoration: line-through; }
        .task-actions { display: flex; gap: 5px; }
        .btn-action { border: none; background: transparent; font-size: 18px; cursor: pointer; }

        /* === الاحتفال === */
        .confetti-piece { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>

    <!-- خلفية العالم الحي -->
    <div class="world-background" id="worldBg">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="stars"></div>
        
        <!-- غيوم ☁️ -->
        <div class="cloud-icon" style="top: 10%; left: -10%;">☁️</div>
        <div class="cloud-icon" style="top: 25%; left: -15%; animation-duration: 30s; animation-delay: 5s;">☁️</div>
        <div class="cloud-icon" style="top: 15%; left: -20%; animation-duration: 40s; animation-delay: 15s;">☁️</div>
        
        <!-- شجرة -->
        <div class="tree-container">🌳</div>
        
        <!-- وردتان متمايلتان -->
        <div class="flowers">🌸 🌷</div>
        
        <!-- قطة -->
        <div class="cat">🐱</div>
    </div>

    <!-- واجهة التطبيق -->
    <div id="root"></div>

    <script type="text/babel">
        // === 1. الثيم واللغة الحية ===
        const lang = navigator.language.startsWith('ar') ? 'ar' : 'en';
        const t = (key) => {
            const dict = {
                en: { 
                    title: "My Garden Journal", name: "Name...", start: "Start", stop: "Stop", 
                    add: "Add", done: "Done", tasks: "Tasks", completed: "Done", timer: "min", 
                    placeholder: "Write something cute..."
                },
                ar: { 
                    title: "يوميات حديقتي", name: "اسمك...", start: "ابدأ", stop: "إيقاف", 
                    add: "إضافة", done: "تم", tasks: "مهام", completed: "مكتملة", timer: "دقيقة", 
                    placeholder: "اكتب شيئاً لطيفاً..."
                }
            };
            return dict[lang][key] || key;
        };

        // تحديد الوقت الحقيقي لتحديد النهار/الليل
        const checkTime = () => {
            const h = new Date().getHours();
            const worldBg = document.getElementById('worldBg');
            if (h >= 6 && h < 18) {
                worldBg.className = 'world-background day';
            } else {
                worldBg.className = 'world-background night';
            }
        };
        checkTime();
        setInterval(checkTime, 60000);

        // === 2. التطبيق ===
        function App() {
            const [tasks, setTasks] = React.useState(() => JSON.parse(localStorage.getItem('gardenTasks')) || []);
            const [name, setName] = React.useState(localStorage.getItem('gardenName') || '');
            const [input, setInput] = React.useState('');
            const [timer, setTimer] = React.useState(300);
            const [isRunning, setIsRunning] = React.useState(false);
            const [userMins, setUserMins] = React.useState(5);
            const [now, setNow] = React.useState(new Date());

            React.useEffect(() => {
                localStorage.setItem('gardenTasks', JSON.stringify(tasks));
                localStorage.setItem('gardenName', name);
            }, [tasks, name]);

            // الساعة الحقيقية
            React.useEffect(() => {
                const i = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(i);
            }, []);

            // العداد
            React.useEffect(() => {
                let i = null;
                if (isRunning && timer > 0) {
                    i = setInterval(() => setTimer(prev => prev - 1), 1000);
                } else if (timer === 0 && isRunning) {
                    setIsRunning(false);
                    setTimer(userMins * 60);
                }
                return () => clearInterval(i);
            }, [isRunning, timer]);

            const circumference = 2 * Math.PI * 75;
            const progress = ((userMins * 60 - timer) / (userMins * 60)) * circumference;

            const addTask = () => {
                if (!input.trim()) return;
                setTasks([...tasks, { id: Date.now(), text: input, done: false }]);
                setInput('');
            };

            const toggleDone = (id) => {
                const task = tasks.find(t => t.id === id);
                if (task && !task.done) launchConfetti();
                setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
            };

            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            const total = tasks.length;
            const done = tasks.filter(t => t.done).length;
            const rate = total === 0 ? 0 : Math.round((done / total) * 100);

            return (
                <div className="glass-container">
                    <div className="header">
                        <h2>🌸 {t('title')}, <input className="name-input" value={name} onChange={(e) => setName(e.target.value)} placeholder={t('name')} /></h2>
                        <div className="time-date">
                            <span>{now.toLocaleTimeString()}</span>
                            <span>{now.toLocaleDateString()}</span>
                        </div>
                    </div>

                    <div className="stats-grid">
                        <div className="stat-card"><div className="num">{rate}%</div>{t('done')}</div>
                        <div className="stat-card"><div className="num">{total}</div>{t('tasks')}</div>
                        <div className="stat-card"><div className="num">{done}</div>{t('completed')}</div>
                    </div>

                    <div className="timer-ring-container">
                        <div className="timer-ring-wrapper">
                            <svg viewBox="0 0 180 180">
                                <circle className="timer-bg" cx="90" cy="90" r="75"></circle>
                                <circle className="timer-progress" cx="90" cy="90" r="75" 
                                    strokeDasharray={circumference} strokeDashoffset={circumference - progress}
                                    style={{ stroke: isRunning ? '#F7A1C4' : '#E8D5F5' }}></circle>
                            </svg>
                            <div className="timer-text">
                                {String(Math.floor(timer/60)).padStart(2,'0')}:{String(timer%60).padStart(2,'0')}
                            </div>
                        </div>
                        <div className="timer-controls">
                            <input className="timer-input" type="number" value={userMins} onChange={(e) => {
                                const v = parseInt(e.target.value);
                                if (v > 0) { setUserMins(v); setTimer(v * 60); }
                            }} min="1" />
                            <span>{t('timer')}</span>
                            <button className={`timer-btn ${isRunning ? 'stop' : ''}`} onClick={() => setIsRunning(!isRunning)}>
                                {isRunning ? t('stop') : t('start')}
                            </button>
                        </div>
                    </div>

                    <div className="task-grid">
                        {tasks.length === 0 && <div style={{textAlign:'center', opacity:0.7, padding:'20px'}}>🌸 {t('placeholder')}</div>}
                        {tasks.map(task => (
                            <div key={task.id} className={`task-card ${task.done ? 'done' : ''}`}>
                                <span>{task.text}</span>
                                <div className="task-actions">
                                    <button className="btn-action" onClick={() => toggleDone(task.id)}>{task.done ? '↩️' : '✅'}</button>
                                    <button className="btn-action" onClick={() => deleteTask(task.id)}>✕</button>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div style={{display:'flex', gap:'10px', marginTop:'25px'}}>
                        <input style={{flex:1, padding:'12px', borderRadius:'30px', border:'1px solid rgba(212,175,55,0.3)', background:'rgba(255,255,255,0.1)', color:'inherit', outline:'none'}} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addTask()} placeholder={t('placeholder')} />
                        <button style={{background:'#F7A1C4', color:'white', border:'none', padding:'12px 25px', borderRadius:'30px', fontWeight:'700', cursor:'pointer'}} onClick={addTask}>➕ {t('add')}</button>
                    </div>
                </div>
            );
        }

        // === 3. الاحتفال ===
        function launchConfetti() {
            const colors = ['#F7A1C4', '#FCE4EC', '#FFD54F', '#80CBC4', '#B39DDB', '#FFAB91'];
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const size = Math.random() * 8 + 6;
                const shape = Math.random() > 0.5 ? 'circle' : 'square';
                piece.className = `confetti-piece ${shape}`;
                piece.style.left = `${left}vw`;
                piece.style.backgroundColor = color;
                piece.style.width = `${size}px`;
                piece.style.height = `${size}px`;
                document.body.appendChild(piece);
                
                let startTime = null;
                const startY = -10;
                const endY = window.innerHeight + 10;
                const wobbleX = (Math.random() - 0.5) * 300;
                const duration = Math.random() * 2 + 2;
                const rotation = Math.random() * 720;

                function animatePiece(time) {
                    if (startTime === null) startTime = time;
                    const progress = (time - startTime) / (duration * 1000);
                    if (progress >= 1) { piece.remove(); return; }
                    const y = startY + (endY - startY) * progress;
                    const x = wobbleX * Math.sin(progress * 10);
                    piece.style.transform = `translate(${x}px, ${y}px) rotate(${rotation * progress}deg)`;
                    piece.style.opacity = 1 - (progress * 0.8);
                    requestAnimationFrame(animatePiece);
                }
                setTimeout(() => requestAnimationFrame(animatePiece), Math.random() * 500);
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
