<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Zen Journal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== تدرجات الألوان (بنفسجي + كريمي) ===== */
        :root {
            --bg-main: #FCF8F2; /* كريمي فاتح جداً */
            --purple-light: #E6E0F8; /* بنفسجي فاتح */
            --purple-main: #9B8BFF; /* بنفسجي متوسط */
            --purple-dark: #6C5CE7; /* بنفسجي غامق */
            --card-bg: rgba(255, 255, 255, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.3);
            --text-main: #3D2C3D;
            --text-muted: #887A8E;
            --shadow: 0 10px 30px rgba(155, 139, 255, 0.1);
            --gold: #D4AF37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; transition: all 0.3s ease; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
        }

        .app-container {
            max-width: 900px; width: 100%;
            position: relative;
        }

        /* ===== الإطار الذهبي الفاخر (محاكاة) ===== */
        .gold-frame {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 40px; padding: 30px;
            box-shadow: var(--shadow), 0 0 0 2px var(--gold), 0 0 0 4px var(--bg-main);
            border: 2px solid var(--gold);
        }

        /* ===== شاشة البداية (Modal) ===== */
        .onboarding-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(61, 44, 61, 0.7); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .onboarding-box {
            background: white; padding: 40px; border-radius: 30px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .onboarding-box h2 { color: var(--purple-main); margin-bottom: 10px; }
        .onboarding-box input {
            width: 100%; padding: 12px; border-radius: 15px;
            border: 1px solid #eee; outline: none; margin: 15px 0; font-weight: 600;
        }
        .onboarding-box input:focus { border-color: var(--purple-main); }
        .onboarding-box select {
            width: 100%; padding: 12px; border-radius: 15px;
            border: 1px solid #eee; outline: none; margin-bottom: 20px; font-weight: 600;
        }
        .onboarding-box button {
            width: 100%; padding: 12px; background: var(--purple-main);
            color: white; border: none; border-radius: 15px; font-weight: 700; cursor: pointer;
        }

        /* ===== رأس الصفحة ===== */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .header-title { font-size: 22px; font-weight: 700; color: var(--purple-dark); }
        .header-right { display: flex; gap: 15px; align-items: center; }
        .lang-badge { background: var(--purple-light); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--purple-dark); }
        .avatar-icon { width: 40px; height: 40px; background: var(--purple-main); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; }

        /* ===== بطاقات الإحصائيات ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-item { background: var(--card-bg); border-radius: 20px; padding: 20px; text-align: center; border: var(--glass-border); }
        .stat-item .icon { font-size: 28px; margin-bottom: 5px; }
        .stat-item .val { font-size: 22px; font-weight: 700; color: var(--purple-dark); }
        .stat-item .lbl { font-size: 12px; color: var(--text-muted); }

        /* ===== المؤقت ===== */
        .timer-wrapper { background: var(--card-bg); border-radius: 30px; padding: 15px 25px; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; border: var(--glass-border); }
        .timer-display { font-size: 28px; font-weight: 700; color: var(--purple-main); }
        .timer-btn { background: var(--purple-dark); color: white; border: none; padding: 8px 25px; border-radius: 30px; font-weight: 700; cursor: pointer; }

        /* ===== الأقسام القابلة للضغط ===== */
        .section-title { font-size: 16px; font-weight: 700; color: var(--purple-dark); margin: 20px 0 10px 0; display: flex; align-items: center; gap: 10px; }
        .clickable-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: var(--glass-border); cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .clickable-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--purple-main); }
        .clickable-card .arrow { color: var(--purple-main); font-size: 18px; }

        /* ===== نافذة التفاصيل (Modal) ===== */
        .detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(61, 44, 61, 0.6); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .detail-modal.hidden { display: none; }
        .detail-content { background: white; border-radius: 30px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #333; }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .timer-wrapper { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // === إعدادات الترجمة ===
        const translations = {
            en: {
                title: "PRODUCTIVE ZEN JOURNAL",
                namePlaceholder: "Enter your name...",
                startBtn: "Start Your Journey",
                stats: ["Total Goals", "Active Projects", "Milestones"],
                timer: "Focus Timer",
                start: "Start Cycle",
                sections: ["Productivity Trackers", "Priority Matrix", "Mood & Wellbeing"]
            },
            ar: {
                title: "مجلة الإنتاجية الهادئة",
                namePlaceholder: "اكتب اسمك ...",
                startBtn: "ابدأ رحلتك",
                stats: ["الأهداف الكلية", "المشاريع النشطة", "الإنجازات"],
                timer: "مؤقت التركيز",
                start: "ابدأ الدورة",
                sections: ["تتبع الإنتاجية", "مصفوفة الأولويات", "المزاج والعافية"]
            }
        };

        function App() {
            const [userName, setUserName] = React.useState(localStorage.getItem('zenUserName') || '');
            const [language, setLanguage] = React.useState(localStorage.getItem('zenLang') || 'en');
            const [isOnboarding, setIsOnboarding] = React.useState(true);
            const [activeModal, setActiveModal] = React.useState(null);

            // حفظ البيانات عند التغيير
            React.useEffect(() => {
                if(userName && language) {
                    localStorage.setItem('zenUserName', userName);
                    localStorage.setItem('zenLang', language);
                }
            }, [userName, language]);

            // عند الضغط على "ابدأ"
            const handleStart = () => {
                if(userName.trim()) {
                    setIsOnboarding(false);
                }
            };

            const t = (key) => translations[language][key] || key;

            // إذا كانت شاشة البداية ظاهرة
            if (isOnboarding) {
                return (
                    <div className="onboarding-overlay">
                        <div className="onboarding-box">
                            <h2>🌸 {t('title')}</h2>
                            <input 
                                type="text" 
                                placeholder={t('namePlaceholder')} 
                                value={userName} 
                                onChange={(e) => setUserName(e.target.value)}
                            />
                            <select value={language} onChange={(e) => setLanguage(e.target.value)}>
                                <option value="en">🇬🇧 English</option>
                                <option value="ar">🇸🇦 العربية</option>
                            </select>
                            <button onClick={handleStart}>{t('startBtn')}</button>
                        </div>
                    </div>
                );
            }

            // لوحة التحكم الرئيسية
            return (
                <div className="app-container">
                    <div className="gold-frame">
                        <div className="header">
                            <div className="header-title">🌸 {userName}'s {t('title')}</div>
                            <div className="header-right">
                                <div className="lang-badge">{language === 'en' ? 'EN' : 'عربي'}</div>
                                <div className="avatar-icon">🐻</div>
                            </div>
                        </div>

                        {/* الإحصائيات */}
                        <div className="stats-grid">
                            <div className="stat-item"><div className="icon">🏆</div><div className="val">100%</div><div className="lbl">{t('stats')[0]}</div></div>
                            <div className="stat-item"><div className="icon">📖</div><div className="val">1</div><div className="lbl">{t('stats')[1]}</div></div>
                            <div className="stat-item"><div className="icon">🏅</div><div className="val">1</div><div className="lbl">{t('stats')[2]}</div></div>
                        </div>

                        {/* المؤقت */}
                        <div className="timer-wrapper">
                            <div><div style={{fontSize:'12px', color:'var(--text-muted)'}}>{t('timer')}</div><div className="timer-display">05:00</div></div>
                            <button className="timer-btn">{t('start')}</button>
                        </div>

                        {/* الأقسام القابلة للضغط */}
                        <div className="section-title">📊 {t('sections')[0]}</div>
                        <div className="clickable-card" onClick={() => setActiveModal('trackers')}>
                            <span>View your focus cycles, habit streaks, and weekly progress</span>
                            <span className="arrow">🔍</span>
                        </div>

                        <div className="section-title">📌 {t('sections')[1]}</div>
                        <div className="clickable-card" onClick={() => setActiveModal('matrix')}>
                            <span>Organize tasks by urgency and importance</span>
                            <span className="arrow">🔍</span>
                        </div>

                        <div className="section-title">🌿 {t('sections')[2]}</div>
                        <div className="clickable-card" onClick={() => setActiveModal('mood')}>
                            <span>Track your daily mood and mindfulness moments</span>
                            <span className="arrow">🔍</span>
                        </div>

                        {/* نافذة التفاصيل المنبثقة */}
                        <div className={`detail-modal ${activeModal ? '' : 'hidden'}`} onClick={() => setActiveModal(null)}>
                            <div className="detail-content" onClick={(e) => e.stopPropagation()}>
                                <span className="close-btn" onClick={() => setActiveModal(null)}>✕</span>
                                <h2 style={{color:'var(--purple-main)', marginBottom:'15px'}}>
                                    {activeModal === 'trackers' ? '📊 Productivity Trackers' :
                                     activeModal === 'matrix' ? '📌 Priority Matrix' :
                                     '🌿 Mood & Wellbeing'}
                                </h2>
                                <p style={{color:'var(--text-muted)'}}>
                                    This is where the detailed charts, grids, and interactive tools will appear. 
                                    You can easily customize this section to fit your personal workflow!
                                </p>
                                <div style={{marginTop:'20px', padding:'20px', background:'var(--purple-light)', borderRadius:'15px'}}>
                                    <span style={{fontWeight:'600', color:'var(--purple-dark)'}}>✨ Interactive Area</span>
                                    <p style={{fontSize:'13px', marginTop:'5px'}}>This is a preview of the detailed content. The design will be fully interactive once we add the components.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
